name: Build dav2d (VideoLAN AV2 Decoder)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 使用最新的 Windows 预览版以获得最佳的 MSVC 编译器优化
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    
    runs-on: ${{ matrix.os }}

    steps:
      # 1. 仅克隆 dav2d 核心源码，跳过庞大且容易报权限错误的测试数据集
      - name: Clone dav2d Source
        run: git clone https://code.videolan.org/videolan/dav2d.git dav2d_src

      # 2. 设置 Python 环境 (为安装 Meson/Ninja 做准备)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 安装跨平台构建工具：Meson 和 Ninja
      - name: Install Meson and Ninja
        run: pip install meson ninja

      # 4a. 安装 Linux 依赖 (NASM)
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      # 4b. 安装 macOS 依赖 (NASM)
      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      # 4c. 安装 Windows 依赖 (NASM)
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. 配置 Meson (去掉了 -Dtestdata_tests=true)
      - name: Configure Meson
        run: meson setup build --default-library=static --buildtype=release
        working-directory: dav2d_src

      # 6. 开始编译 (全速生成二进制文件)
      - name: Build with Ninja
        run: ninja -C build
        working-directory: dav2d_src

      # 7a. 上传编译产物 (Linux / macOS)
      - name: Upload Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dav2d-binary-${{ matrix.os }}
          path: dav2d_src/build/tools/dav2d
          retention-days: 7

      # 7b. 上传编译产物 (Windows)
      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dav2d-binary-${{ matrix.os }}
          path: dav2d_src/build/tools/dav2d.exe
          retention-days: 7 