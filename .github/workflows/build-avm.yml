name: Build AVM (AV2 Reference Encoder)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]

    steps:
      # 1. 获取代码 (已更新为官方新的 GitHub 仓库地址)
      - name: Clone AVM from GitHub
        run: git clone https://github.com/AOMediaCodec/avm.git avm_src

      # 2. 安装 Linux 依赖
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm cmake perl python3 build-essential

      # 3. 安装 macOS 依赖
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install yasm cmake perl python3

      # 4. 安装 Windows 依赖
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5a. 配置 CMake (Linux / macOS) - 保持默认生成器
      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -S avm_src -B build -DCMAKE_BUILD_TYPE=Release

      # 5b. 配置 CMake (Windows) - 强行锁定 Visual Studio 生成器，防止误选 MinGW/Ninja
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S avm_src -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release

      # 6a. 编译 (Linux / macOS) - 保持 4 线程全速冲锋
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 4

      # 6b. 编译 (Windows) - 降低到 2 线程，防止 TensorFlow 撑爆 7GB 内存导致假死
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 2

      # 7a. 上传产物 (Linux / macOS)
      - name: Upload Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: avm-binaries-${{ matrix.os }}
          path: |
            build/avmenc
            build/avmdec
          retention-days: 7

      # 7b. 上传产物 (Windows)
      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: avm-binaries-${{ matrix.os }}
          path: |
            build/Release/avmenc.exe
            build/Release/avmdec.exe
          retention-days: 7