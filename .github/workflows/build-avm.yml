name: Build AVM (AV2 Reference Encoder)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]

    steps:
      # 1. 获取代码
      - name: Clone AVM from GitLab
        run: git clone https://gitlab.com/AOMediaCodec/avm.git avm_src

      # 2. 安装 Linux 依赖
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm cmake perl python3 build-essential

      # 3. 安装 macOS 依赖
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install yasm cmake perl python3

      # 4. 安装 Windows 依赖
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. 配置
      - name: Configure CMake
        run: cmake -S avm_src -B build -DCMAKE_BUILD_TYPE=Release

      # 6. 编译
      - name: Build
        run: cmake --build build --config Release --parallel 4

      # (测试步骤已暂时移除，优先保证拿到编译产物)

      # 7a. 上传产物 (Linux / macOS) - 使用最新的 avmenc / avmdec 命名
      - name: Upload Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: avm-binaries-${{ matrix.os }}
          path: |
            build/avmenc
            build/avmdec
          retention-days: 7

      # 7b. 上传产物 (Windows) - 使用最新的 avmenc.exe / avmdec.exe 命名
      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: avm-binaries-${{ matrix.os }}
          path: |
            build/Release/avmenc.exe
            build/Release/avmdec.exe
          retention-days: 7