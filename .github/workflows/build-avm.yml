name: Build AVM (AV2 Reference Encoder)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]

    steps:
      - name: Clone AVM from GitLab
        run: git clone https://gitlab.com/AOMediaCodec/avm.git avm_src

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yasm \
            cmake \
            perl \
            python3 \
            build-essential \
            pkg-config \
            libvmaf-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install yasm cmake perl python3 pkg-config libvmaf

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          vcpkg install libvmaf:x64-windows

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S avm_src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONFIG_TUNE_VMAF=1

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S avm_src -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCONFIG_TUNE_VMAF=1 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Prepare Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp build/avmenc artifact/
          cp build/avmdec artifact/
          chmod +x artifact/avmenc artifact/avmdec

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          Copy-Item build/Release/avmenc.exe artifact/
          Copy-Item build/Release/avmdec.exe artifact/

          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" artifact/ -ErrorAction SilentlyContinue
          }

          Get-ChildItem artifact

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avm-binaries-${{ matrix.os }}-vmaf
          path: artifact/
          retention-days: 7